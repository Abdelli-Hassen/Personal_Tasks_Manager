<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des tâches</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4f46e5">
<style>
:root{
  --bg:#eef1f8;--bg2:#e0e7f8;--card:#fff;--ink:#0f172a;--mute:#566079;--line:#dbe1ee;
  --accent:#4f46e5;--accent2:#7c3aed;--accent-soft:#e6e8ff;--solid:#4f46e5;--solid2:#7c3aed;--pl:28%;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.07);
  --ok:#0b7a43;--ok-bg:#d2f1e1;--wip:#955500;--wip-bg:#ffeab8;--todo:#434d68;--todo-bg:#e4e8f2;--conf:#6a2cc2;--conf-bg:#eadffc;--err:#d62f2f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0e16;--bg2:#131830;--card:#161b29;--ink:#e9ecf5;--mute:#8f9ab4;--line:#262d42;--accent:#8b9bff;--accent2:#b49bff;--accent-soft:#222a4d;--solid:#5b61f0;--solid2:#8b5cf6;--pl:78%;--shadow:0 1px 2px rgba(0,0,0,.3);
  --ok:#4fd093;--ok-bg:#123327;--wip:#f4b950;--wip-bg:#3a2d12;--todo:#a7b0c6;--todo-bg:#242a3a;--conf:#c1a0f8;--conf-bg:#2c2347;--err:#ff7b7b}}
:root[data-theme=dark]{
  --bg:#0b0e16;--bg2:#131830;--card:#161b29;--ink:#e9ecf5;--mute:#8f9ab4;--line:#262d42;--accent:#8b9bff;--accent2:#b49bff;--accent-soft:#222a4d;--solid:#5b61f0;--solid2:#8b5cf6;--pl:78%;--shadow:0 1px 2px rgba(0,0,0,.3);
  --ok:#4fd093;--ok-bg:#123327;--wip:#f4b950;--wip-bg:#3a2d12;--todo:#a7b0c6;--todo-bg:#242a3a;--conf:#c1a0f8;--conf-bg:#2c2347;--err:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 340px) no-repeat;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--solid),var(--solid2));border:0;color:#fff;font-weight:600;padding:9px 16px}
.btn.sm{padding:3px 9px;font-size:12.5px}

/* header */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;margin:0;letter-spacing:-.03em}
.sub{color:var(--mute);font-size:13px;text-transform:capitalize}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;color:var(--mute);max-width:480px}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.pill.ok .dot{background:var(--ok)}.pill.busy .dot{background:var(--wip)}.pill.err .dot{background:var(--err)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--card);border-radius:20px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;letter-spacing:-.02em}
.scope-title{font-size:18px;font-weight:650;margin-bottom:10px}
.tm{display:inline-block;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:0;background:var(--bg);border-radius:12px;padding:8px 14px;text-align:left;cursor:pointer;min-width:100px}
.stat:hover,.stat.on{background:var(--accent-soft)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}

/* strip */
.strip{display:flex;gap:8px;align-items:stretch;margin-bottom:14px;overflow-x:auto;padding:2px 2px 6px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:8px}
.day{background:var(--card);border:2px solid transparent;border-radius:14px;padding:9px 4px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.day small{display:block;color:var(--mute);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.day strong{font-size:20px;display:block;line-height:1.3}
.day em{font-style:normal;font-size:11.5px;color:var(--mute)}
.day i{display:block;height:4px;margin:5px 12px 0;border-radius:2px;background:var(--line);overflow:hidden}
.day i u{display:block;height:100%;background:var(--ok)}
.day{border:2px solid var(--line)}
.day:hover{border-color:var(--accent)}
.day.sel{border-color:var(--solid);background:var(--solid);color:#fff;transform:translateY(-2px)}
.day.sel small,.day.sel em{color:rgba(255,255,255,.85)}
.day.sel i{background:rgba(255,255,255,.3)}.day.sel i u{background:#fff}
.day.today:not(.sel){border-color:var(--accent)}
.day.today small{color:var(--accent);font-weight:800}
.day.today.sel small{color:#fff}
.task,.stat,.card,.pill,.btn,.seg,.chip{border:1px solid var(--line)}
.task{border-left:6px solid var(--bar,var(--line))}
.st-todo{--bar:var(--todo)}.st-wip{--bar:var(--wip)}.st-conf{--bar:var(--conf)}.st-ok,.st-done{--bar:var(--ok)}
.hero{border:1px solid var(--line)}
.stat.on{background:var(--solid);border-color:var(--solid);color:#fff}.stat.on span{color:rgba(255,255,255,.85)}
.seg button.on,.chip.on{box-shadow:0 1px 4px rgba(0,0,0,.2)}
.navb{align-self:center;flex:none}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:170px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--solid);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* list */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:15px;text-transform:capitalize}
.ghead span{color:var(--mute);font-size:13px;text-transform:none}
.ghead .btn{margin-left:auto;text-transform:none}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);padding:11px 14px;border-radius:14px;margin-bottom:6px;box-shadow:var(--shadow)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:13px;padding:0}
.chk:hover{border-color:var(--ok)}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.t{word-break:break-word;cursor:pointer}
.c{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.pdv{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;margin-right:8px;vertical-align:1px;
  background:hsl(var(--h) 80% 50%/.14);color:hsl(var(--h) 60% var(--pl))}
.pv .hero,.pv .strip,.pv .toolbar,.pv .chips{display:none!important}
.prj,.dj{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:1px;background:var(--conf-bg);color:var(--conf)}
.dj{background:var(--todo-bg);color:var(--todo)}
.pnew{display:flex;gap:8px;margin-bottom:16px}.pnew input{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);display:grid;gap:6px}
.pcard:hover{border-color:var(--accent)}
.pcard.pdone{border-color:var(--ok)}.pcard.pdone b,.pcard.pdone span{color:var(--ok)}
.pcard b{font-size:16px}.pcard span,.pcard small{color:var(--mute);font-size:12.5px}
.pbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pbar u{display:block;height:100%;background:var(--ok)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.phead h2{margin:0;font-size:22px;flex:1}
.pinfo{color:var(--mute);font-size:13px;margin-bottom:12px}
.picklist{display:grid;gap:6px;max-height:50vh;overflow:auto}
dialog .pk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;cursor:pointer}
dialog .pk:hover{border-color:var(--accent)}
dialog .pk input{flex:none}
.pk .pkt{flex:1;min-width:0;word-break:break-word}
.pk small{color:var(--mute);white-space:nowrap}
.per{display:inline-block;width:100%;color:var(--ok);font-size:12.5px;margin-top:2px}
.wk{font-size:11px;color:var(--wip);background:var(--wip-bg);border-radius:6px;padding:1px 6px;margin-left:6px;cursor:help}
.right{display:flex;gap:4px;align-items:center}
.badge{border:0;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-wip{background:var(--wip-bg);color:var(--wip)}
.s-todo{background:var(--todo-bg);color:var(--todo)}.s-conf{background:var(--conf-bg);color:var(--conf)}
.icon{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;padding:5px;border-radius:6px}
.icon:hover{color:var(--ink);background:var(--bg)}
.empty{text-align:center;color:var(--mute);padding:50px 10px;background:var(--card);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;align-items:start}
.col{background:var(--bg2);border-radius:16px;padding:10px;min-height:140px;border:2px dashed transparent}
.col.over{border-color:var(--accent)}
.col h4{margin:2px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;word-break:break-word}
.card .pdv{margin:0 0 6px}
.card small{display:block;color:var(--mute);font-size:12px;margin-top:5px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,30,.45);backdrop-filter:blur(2px)}
dialog form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog h2{grid-column:1/-1;margin:0;font-size:19px}
dialog label{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}
dialog .full{grid-column:1/-1}
dialog .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:9}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.connect{background:var(--card);border:2px dashed var(--accent);border-radius:20px;padding:28px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow)}
.connect h2{margin:0 0 8px;font-size:21px}
.connect p{margin:0 auto 14px;max-width:520px;color:var(--mute)}
.connect .fname{font-weight:700;color:var(--ink);font-size:17px;background:var(--accent-soft);display:inline-block;padding:6px 14px;border-radius:10px;margin-bottom:12px}
.connect .btn{margin:0 4px}
.connect .skip{margin:16px auto 0;font-size:13px}
.connect a{color:var(--accent);font-weight:600}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menubox{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:5;min-width:270px}
.menubox button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.menubox button:hover{background:var(--accent-soft)}
/* urgent */
.urgl{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important;cursor:pointer}
.urgl{position:relative;padding:8px 12px;border:1px solid var(--line);border-radius:12px;user-select:none}
.urgl input{position:absolute;opacity:0;pointer-events:none}
.urgl .fire{font-size:26px;line-height:1;filter:grayscale(1);opacity:.3;transition:.15s}
.urgl input:checked~.fire{filter:none;opacity:1;transform:scale(1.1)}
.urgl:has(input:checked){border-color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--card))}
.urgl input:focus-visible~.fire{outline:2px solid var(--accent);border-radius:6px}
.urgl .on-t{display:none;font-weight:650}.urgl input:checked~.on-t{display:inline}.urgl input:checked~.off-t{display:none}
.fire.icon{font-size:17px;filter:grayscale(1);opacity:.3}
.fire.icon:hover{opacity:.75}
.fire.icon.lit{filter:none;opacity:1}
.task.urgent,.card.urgent{--bar:var(--err);background:color-mix(in srgb,var(--err) 8%,var(--card))}
.card.urgent{border-left:5px solid var(--err)}
.ub{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--err);border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.icon.on{color:var(--err)}
/* mise en page : tout aligné sur la même grille */
.hero-main{min-width:0}
.scope-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.scope-row .scope-title{margin:0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{min-width:0;padding:10px 14px}
.strip{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:stretch;overflow:visible;padding:0;margin-bottom:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;min-width:0}
.day{height:92px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day em{height:16px;line-height:16px}
.day i{width:56%;margin:5px 0 0}
.navb{width:auto;align-self:stretch;font-size:22px;padding:0;border-radius:14px}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .strip{grid-template-columns:34px 1fr 34px;gap:6px}
  .days{gap:5px}.day{height:78px}.day strong{font-size:17px}.day em{font-size:10.5px}
  .toolbar .seg{flex:1 1 auto}
}
[hidden]{display:none!important}
@media (max-width:700px){
  .hero{grid-template-columns:1fr;justify-items:start}
  .task{grid-template-columns:auto 1fr}
  .right{grid-column:1/-1;justify-content:flex-end}
  .board{grid-template-columns:repeat(4,240px)}
  dialog form{grid-template-columns:1fr}
}
/* ---------- refonte visuelle ---------- */
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:800;letter-spacing:-.04em}
.sub{font-weight:500}
input,select,textarea{border-radius:12px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
.btn{border-radius:12px;font-weight:550;transition:transform .12s,box-shadow .15s,border-color .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,30,70,.12)}
.btn:active{transform:none}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible,.chk:focus-visible,.icon:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--solid) 38%,transparent)}
.btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--solid) 46%,transparent);filter:brightness(1.07)}
.btn.danger{background:var(--err);border:0;color:#fff;font-weight:600;padding:9px 16px}
.btn.sm{border-radius:10px}
.pill{box-shadow:var(--shadow)}
.hero{border-radius:24px;padding:22px 26px;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--accent-soft) 45%,var(--card)))}
.ring,.ring svg{width:104px;height:104px}
.ring b{font-size:24px;font-weight:800}
.scope-title{font-size:19px;font-weight:750;letter-spacing:-.02em}
.stat{border-radius:16px;background:color-mix(in srgb,var(--bg) 70%,var(--card));transition:transform .15s,background .15s}
.stat:hover{transform:translateY(-1px)}
.stat.on{background:linear-gradient(135deg,var(--solid),var(--solid2));box-shadow:0 6px 16px color-mix(in srgb,var(--solid) 34%,transparent)}
.stat b{font-weight:800}
.day{border-radius:18px;transition:transform .15s,border-color .15s}
.day:hover{transform:translateY(-2px)}
.day.sel{background:linear-gradient(160deg,var(--solid),var(--solid2));box-shadow:0 8px 20px color-mix(in srgb,var(--solid) 36%,transparent)}
.seg{border-radius:14px;box-shadow:var(--shadow)}
.seg button{border-radius:10px;transition:background .15s,color .15s;font-weight:550}
.seg button.on{background:linear-gradient(135deg,var(--solid),var(--solid2))}
.chip{transition:border-color .15s,color .15s;font-weight:550}
.chip:not(.on):hover{border-color:var(--accent);color:var(--ink)}
.group{margin-bottom:26px}
.ghead{font-size:16px;font-weight:750;letter-spacing:-.02em}
.task{border-radius:18px;padding:12px 16px;border-left-width:5px;transition:transform .15s,box-shadow .15s}
.task:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,30,70,.13)}
.chk{width:24px;height:24px;transition:transform .15s,background .15s,border-color .15s}
.chk:hover{transform:scale(1.12);background:var(--ok-bg)}
.done .chk:hover{background:var(--ok)}
.badge{padding:6px 12px}
.icon{transition:color .15s,background .15s,opacity .15s}
.tm,.pdv,.prj,.dj,.ub{border-radius:8px}
.card{border-radius:14px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px)}
.col{border-radius:20px}
.empty{border:1px dashed var(--line);border-radius:20px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.pcard{border-radius:20px;transition:transform .15s,box-shadow .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,30,70,.14)}
.pnew input{border-radius:14px;padding:11px 14px}
.menubox{border-radius:16px;padding:8px}
.connect{border-radius:24px}
/* fenêtres */
dialog{border:1px solid var(--line);border-radius:24px;width:min(540px,94vw);box-shadow:0 30px 80px rgba(8,12,30,.35);animation:pop .18s ease-out}
dialog::backdrop{background:rgba(10,14,30,.5);backdrop-filter:blur(6px);animation:fade .18s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
dialog form{padding:26px;gap:14px}
dialog h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
dialog label{font-size:12px;font-weight:650;letter-spacing:.02em;text-transform:uppercase}
dialog label input,dialog label select{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
dialog .acts{padding-top:6px}
dialog .pk,dialog .urgl{text-transform:none;letter-spacing:0;font-weight:500}
dialog.ask{width:min(430px,92vw)}
.askbox{padding:26px;display:grid;gap:14px}
.askbox h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
.askbox p{margin:0;color:var(--mute);white-space:pre-line}
.askbox .acts{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.toast{border-radius:16px;padding:12px 18px;animation:pop .2s ease-out;font-weight:550}
/* barre du haut : toujours alignée à droite, même quand elle passe sous le titre */
.hr{margin-left:auto;justify-content:flex-end}
@media (max-width:700px){.hr{justify-content:flex-start;margin-left:0}}
a.icon.mail{text-decoration:none;color:var(--accent)}
a.icon.mail:hover{background:var(--accent-soft);color:var(--accent)}
.maillink{color:var(--accent);font-weight:600;text-decoration:none}
.maillink:hover{text-decoration:underline}
.pcard{position:relative}
.pcard b{padding-right:52px}
.pcard .pfire{position:absolute;top:8px;right:8px}
.pcard .ub{color:#fff;font-size:10.5px}
.pcard.urgent{border-color:var(--err);background:color-mix(in srgb,var(--err) 8%,var(--card))}
/* boutons plus grands (cibles faciles à cliquer) */
.btn{padding:10px 18px;font-size:15px}
.btn.primary{padding:11px 20px}
.btn.sm{padding:8px 15px;font-size:14px;border-radius:12px}
.pill{font-size:14px;padding:7px 9px 7px 14px}
.pill .btn.sm{padding:6px 12px}
.seg button{padding:8px 16px;font-size:14.5px}
.chip{padding:8px 16px;font-size:14.5px}
.stat{min-height:64px}
.icon{font-size:20px;min-width:42px;height:42px;padding:0;border-radius:12px;display:inline-grid;place-items:center}
.icon.fire,.fire.icon{font-size:22px}
.right{gap:6px}
.badge{padding:8px 16px;font-size:14px}
.chk{width:30px;height:30px;font-size:16px}
.navb{min-width:48px}
.menubox button{padding:12px 14px;font-size:15px}
@media (max-width:700px){.icon{min-width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}

<body>
<div class="wrap">
  <header>
    <div><h1>Suivi des tâches</h1><div class="sub" id="today"></div></div>
    <div class="hr">
      <div class="pill" id="pill"><i class="dot"></i><span id="pillTxt"></span><button class="btn sm" id="pillBtn"></button><button class="btn sm" id="pillBtn2">Délier</button><button class="btn sm" id="pillBtn3" title="Recharger depuis le fichier">↻</button></div>
      <details class="menu" id="expMenu"><summary class="btn">⤓ Exporter</summary>
        <div class="menubox">
          <button data-ex="xlsx-all">Excel (.xlsx) — tout</button>
          <button data-ex="xlsx-view">Excel (.xlsx) — vue actuelle</button>
          <button data-ex="csv-all">CSV — tout (format du fichier lié)</button>
          <button data-ex="csv-view">CSV — vue actuelle</button>
        </div></details>
      <button class="btn" id="projBtn">📁 Projets</button>
      <button class="btn" id="theme" title="Thème">◐</button>
      <button class="btn primary" id="new">+ Nouvelle tâche <kbd style="opacity:.6;font-size:11px">N</kbd></button>
    </div>
  </header>

  <section class="connect" id="connect" hidden></section>

  <section class="hero">
    <div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="9"/><circle id="arc" cx="48" cy="48" r="40" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3" style="transition:stroke-dashoffset .5s"/></svg><b id="pct">0%</b></div>
    <div class="hero-main"><div class="scope-row"><div class="scope-title" id="scopeTitle"></div><button class="btn sm" id="todayBtn">Aujourd'hui</button></div><div class="stats" id="stats"></div></div>
  </section>

  <div class="strip" id="strip"></div>

  <div class="toolbar">
    <div class="seg" id="scope"><button data-v="day">Jour</button><button data-v="week">Semaine</button><button data-v="all">Tout</button></div>
    <div class="seg" id="mode"><button data-v="list">Liste</button><button data-v="board">Tableau</button></div>

    <div class="seg" id="qf" title="Où chercher"><button data-v="pdv">Contexte</button><button data-v="task">Tâche</button><button data-v="all">Tout</button></div>
    <select id="pdvSel"></select>
  </div>
  <div class="chips" id="chips"></div>

  <div id="main"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Nouvelle tâche</h2>
    <label>Jour<input type="date" name="date"></label>
    <label>Heure<input type="time" name="time"></label>
    <label class="full">Projet<select name="project"></select></label>
    <label>PDV / contexte<input name="pdv" list="pdvs" required placeholder="ex. Total Gr"></label>
    <label>Situation<select name="status"></select></label>
    <label class="full">Tâche<input name="task" required placeholder="Que faut-il faire ?"></label>
    <label class="full">Commentaire<input name="comment" placeholder="optionnel"></label>
    <label class="full">Lien (e-mail ou fichier)<input name="link" type="url" pattern="https?://\S+" placeholder="Collez le lien d'un e-mail ou d'un fichier  optionnel" title="Un lien commençant par http:// ou https://"></label>
    <datalist id="pdvs"></datalist>
    <label class="full urgl"><input type="checkbox" name="urgent"><span class="fire">🔥</span><span class="ut on-t">Urgente : allumée, en haut de la liste</span><span class="ut off-t">Pas urgente : éteinte (cliquer pour allumer)</span></label>
    <div class="acts"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary" id="ok">Ajouter</button></div>

</dialog>
<dialog id="ask" class="ask">
  <div class="askbox">
    <h2 id="askTitle"></h2>
    <p id="askMsg"></p>
    <input id="askInput" hidden>
    <div class="acts"><button type="button" class="btn" id="askCancel">Annuler</button><button type="button" class="btn primary" id="askOk">OK</button></div>
  </div>
</dialog>
<dialog id="pick">
  <form method="dialog" id="pform">
    <h2>Ajouter des tâches existantes</h2>
    <input class="full" id="pickQ" type="search" placeholder="Rechercher une tâche, un PDV…">
    <div class="full picklist" id="pickList"></div>
    <div class="acts"><button type="button" class="btn" id="pickCancel">Annuler</button><button class="btn primary" id="pickOk">Ajouter</button></div>
  </form>
</dialog>
<div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastBtn">Annuler</button></div>

<script>
const STATUS={
  todo:{label:"À faire",cls:"s-todo"},
  wip:{label:"En cours",cls:"s-wip"},
  conf:{label:"Confirmé",cls:"s-conf"},
  ok:{label:"Résolu",cls:"s-ok"},
  done:{label:"Fini",cls:"s-ok"}
};
const COLS=[["todo","À faire"],["wip","En cours"],["conf","Confirmé"],["fin","Terminé"]];
const isDone=s=>s==="ok"||s==="done";
const colOf=s=>isDone(s)?"fin":s;
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const BYLABEL=Object.fromEntries(Object.entries(STATUS).map(([k,v])=>[norm(v.label),k]));
const DAYS=["dim","lun","mar","mer","jeu","ven","sam"];
const pad=n=>String(n).padStart(2,"0");
const linkIcon=u=>/outlook|office\.com|gmail|mail\./i.test(u)&&!/sharepoint|\.xlsx|\.docx/i.test(u)?"✉":"🔗";
const safeUrl=u=>/^https?:\/\/\S+$/i.test(u||"")?u:"";
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(s,o)=>parse(s).toLocaleDateString("fr-FR",o);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of norm(s))h=(h*31+c.charCodeAt(0))%360;return h};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const short=s=>s.slice(2,4)+"/"+s.slice(5,7)+"/"+s.slice(8,10);
// Une semaine ne déborde jamais sur le mois voisin : elle commence le 1er et s'arrête au dernier jour du mois.
// Semaines du mois : 1–7, 8–14, 15–21, 22–28, puis 29 jusqu'à la fin du mois.
function weekRange(s){
  const d=parse(s),day=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const a=Math.floor((day-1)/7)*7+1,p=s.slice(0,8);
  return [p+pad(a),p+pad(Math.min(a+6,last))];
}
const weekLabel=s=>{const [a,b]=weekRange(s);return short(a)+" -> "+short(b)};

/* ---------- fenêtre de confirmation / saisie (remplace confirm et prompt) ---------- */
// ask({title,msg,ok,cancel,danger}) -> true/false ; avec input:"valeur" -> texte saisi, ou null si annulé
function ask({title,msg="",input,ok="OK",cancel="Annuler",danger=false}){
  return new Promise(res=>{
    const d=$("ask"),i=$("askInput"),b=$("askOk"),c=$("askCancel"),typed=input!==undefined;
    let val=typed?null:false;
    $("askTitle").textContent=title;$("askMsg").textContent=msg;$("askMsg").hidden=!msg;
    i.hidden=!typed;i.value=input??"";
    b.textContent=ok;c.textContent=cancel;b.className="btn "+(danger?"danger":"primary");
    const done=v=>{val=v;d.close()};
    b.onclick=()=>done(typed?i.value:true);
    c.onclick=()=>d.close();
    i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.click()}};
    d.onclose=()=>res(val);
    d.showModal();
    (typed?i:danger?c:b).focus();if(typed)i.select();
  });
}

/* ---------- état ---------- */
const KEY="suivi-taches-v2";
let tasks=[];
try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
if(!Array.isArray(tasks))tasks=[];
let projects=[];
try{projects=JSON.parse(localStorage.getItem("suivi-projets")||"[]")}catch(e){}
if(!Array.isArray(projects))projects=[];
let view="days",openProj=null;
let sel=todayIso,scope="day",mode="list",statusF=new Set(),pdvF="",q="",qf="pdv",editId=null;
try{const p=JSON.parse(localStorage.getItem("suivi-prefs")||"{}");scope=p.scope||scope;mode=p.mode||mode;qf=p.qf||qf;if(p.theme)document.documentElement.dataset.theme=p.theme}catch(e){}
const savePrefs=()=>{try{localStorage.setItem("suivi-prefs",JSON.stringify({scope,mode,qf,theme:document.documentElement.dataset.theme}))}catch(e){}};

/* ---------- noms de PDV : "lac" / "LAC" / "Lac" => une seule graphie ---------- */
const pkey=s=>norm(s).replace(/\s+/g," ");
function canonMap(){
  const c={};
  tasks.forEach(t=>{const k=pkey(t.pdv);c[k]??={};c[k][t.pdv]=(c[k][t.pdv]||0)+1});
  const cap=s=>/^\p{Lu}/u.test(s)?1:0;
  const m={};
  for(const k in c)m[k]=Object.entries(c[k]).sort((a,b)=>b[1]-a[1]||cap(b[0])-cap(a[0]))[0][0];
  return m;
}
function cleanPdvs(){
  const m=canonMap();let n=0;
  tasks.forEach(t=>{
    t.pdv=t.pdv.trim().replace(/\s+/g," ");
    const c=m[pkey(t.pdv)];if(c&&c!==t.pdv){t.pdv=c;n++}
  });
  return n;
}

/* ---------- CSV <-> tâches ---------- */
const HEADER=["Week-date","PDV","Tache","Situation","commentaire","Date","Heure","Urgent","Fait le","Heure fin","Depuis","Projet","Lien"];
const NODAY="Sans jour (projets)";
const isUrg=t=>t.urgent&&!isDone(t.status);
// plus récent d'abord : heure décroissante (sans heure en dernier), puis les dernières ajoutées
const byNew=(a,b)=>{
  const x=a.time||"",y=b.time||"";
  if(x!==y)return !x?1:!y?-1:y.localeCompare(x);
  return tasks.indexOf(b)-tasks.indexOf(a);
};
const byPrio=(a,b)=>(isUrg(b)?1:0)-(isUrg(a)?1:0)||byNew(a,b);
const byRecent=(a,b)=>b.date.localeCompare(a.date)||byPrio(a,b);
const parseTime=s=>{const m=(s||"").trim().match(/^(\d{1,2})[:h](\d{2})/);return m&&+m[1]<24&&+m[2]<60?pad(m[1])+":"+m[2]:""};
const byTime=(a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99");
function parseCsv(text,sep){
  const rows=[];let r=[],c="",inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else inQ=false}else c+=ch}
    else if(ch==='"')inQ=true;else if(ch===sep){r.push(c);c=""}
    else if(ch==="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows;
}
function parseDate(s){
  s=(s||"").trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))return s;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  return null;
}
function labelStart(l){const m=(l||"").match(/^(\d{2})\/(\d{2})\/(\d{2})\s*->/);return m?`20${m[1]}-${m[2]}-${m[3]}`:null}
function fromCsv(text){
  text=text.replace(/^﻿/,"");
  const first=text.split("\n")[0]||"";
  const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const out=[],projs=[];let label=null,start=null;
  parseCsv(text,sep).forEach((r,i)=>{
    const [a,pdv,task,st,cm,dcol,tcol,ucol,fdate,ftime,from,proj,lien]=r.map(x=>(x||"").trim());
    if(a==="#PROJET"){projs.push({name:pdv,done:norm(st)==="termine",doneDate:parseDate(fdate)||"",urgent:/^(oui|yes|1|x|true|urgent)$/i.test(ucol||"")});return}
    if(i===0&&norm(task)==="tache")return;
    if(a&&!pdv&&!task){label=a;start=labelStart(a);return}
    if(!pdv&&!task)return;
    const d=parseDate(dcol)||parseDate(a);
    const nod=!d&&label===NODAY;
    out.push({id:uid(),project:proj||"",link:safeUrl(lien),date:d||(nod?"":start||todayIso),week:!d&&!nod,weekLabel:d||nod?null:label,pdv,task,status:BYLABEL[norm(st)]||"todo",comment:cm||"",time:parseTime(tcol),urgent:/^(oui|yes|1|x|true|urgent)$/i.test(ucol||""),doneDate:isDone(BYLABEL[norm(st)]||"todo")?parseDate(fdate):null,doneTime:parseTime(ftime),from:parseDate(from)});
  });
  fromCsv.projects=projs;
  return out;
}
const cell=s=>/[;"\n\r]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':s;
function toCsv(){
  const groups=new Map();
  tasks.forEach(t=>{
    const label=!t.date?NODAY:t.week&&t.weekLabel?t.weekLabel:weekLabel(t.date);
    if(!groups.has(label))groups.set(label,[]);groups.get(label).push(t);
  });
  const key=l=>labelStart(l)||"9999";
  const rows=[HEADER];
  projects.forEach(p=>rows.push(["#PROJET",p.name,"",p.done?"Terminé":"","","","",p.urgent?"Oui":"",p.done&&p.doneDate||"","","","",""]));
  [...groups.entries()].sort((x,y)=>key(x[0]).localeCompare(key(y[0]))).forEach(([label,list])=>{
    rows.push([label,"","","","","","","","","","","",""]);
    [...list].sort((x,y)=>x.date.localeCompare(y.date)||byTime(x,y)).forEach(t=>rows.push(["",t.pdv,t.task,STATUS[t.status].label,t.comment,t.week?"":t.date,t.time||"",t.urgent?"Oui":"",isDone(t.status)&&t.doneDate||"",isDone(t.status)&&t.doneDate&&t.doneTime||"",t.from||"",t.project||"",t.link||""]));
  });
  return "﻿"+rows.map(r=>r.map(cell).join(";")).join("\r\n")+"\r\n";
}

/* ---------- fichier lié (File System Access) ---------- */
const hasFS="showOpenFilePicker" in window;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("suivi",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{try{const db=await idb();return await new Promise(res=>{const g=db.transaction("kv").objectStore("kv").get(k);g.onsuccess=()=>res(g.result);g.onerror=()=>res(null)})}catch(e){return null}};
const kvSet=async(k,v)=>{try{const db=await idb();db.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}};
let handle=null,lastMod=0,dirty=false,wTimer=null,busy=Promise.resolve(),fsState="none",fsMsg="";

function setFs(state,msg=""){
  fsState=state;fsMsg=msg;
  const p=$("pill"),b=$("pillBtn");
  p.className="pill "+({ok:"ok",busy:"busy",err:"err"}[state]||"");
  const name=handle?handle.name:"";
  const t={none:["Aucun fichier lié","Lier"],
    perm:[name+" — autorisation requise","Reconnecter"],
    ok:["Enregistré dans "+name+(msg?" · "+msg:""),"Changer"],
    busy:["Enregistrement…",""],
    err:[msg||"Erreur d'écriture","Réessayer"],
    nofs:["Navigateur non compatible (utilisez Chrome ou Edge)","Exporter CSV"]}[state];
  $("pillTxt").textContent=t[0];b.textContent=t[1];b.hidden=!t[1];
  $("pillBtn2").hidden=!handle||state==="busy";
  $("pillBtn3").hidden=!(handle&&(state==="ok"||state==="err"));
  renderConnect();
}
function renderConnect(){
  const c=$("connect"),show=["none","perm","nofs"].includes(fsState)&&!(fsState==="none"&&skipConnect);
  c.hidden=!show;if(!show)return;
  c.innerHTML={
    none:`<h2>Choisissez votre fichier de suivi</h2><p>Sélectionnez votre fichier CSV une seule fois. L'application le lit, puis y enregistre chaque modification automatiquement, sur votre ordinateur. Rien n'est envoyé en ligne.</p><button class="btn primary" data-c="pick">Choisir mon fichier CSV</button><button class="btn" data-c="create">Je n'ai pas de fichier : en créer un</button><p class="skip"><a href="#" data-c="skip">Continuer sans fichier</a> (données gardées dans ce navigateur, exportables à tout moment)</p>`,
    perm:`<h2>Est-ce le bon fichier ?</h2><div class="fname">${esc(handle?handle.name:"")}</div><p>Confirmez pour l'ouvrir et reprendre le suivi là où vous l'avez laissé.</p><button class="btn primary" data-c="ok">Oui, ouvrir ce fichier</button><button class="btn" data-c="pick">Choisir un autre fichier</button>`,
    nofs:`<h2>Navigateur non compatible</h2><p>L'enregistrement direct dans le fichier fonctionne avec Chrome ou Edge sur ordinateur. Ici, utilisez « Exporter ».</p>`
  }[fsState];
}
$("connect").onclick=async e=>{
  const b=e.target.closest("[data-c]");if(!b)return;
  e.preventDefault();
  if(b.dataset.c==="pick")return linkFile();
  if(b.dataset.c==="create")return createFile();
  if(b.dataset.c==="skip"){skipConnect=true;return renderConnect()}
  try{if(await ensurePerm(handle,true))await loadFromFile(false)}catch(err){setFs("err",err.message)}
};
async function ensurePerm(h,ask){
  const o={mode:"readwrite"};
  if(await h.queryPermission(o)==="granted")return true;
  return ask&&(await h.requestPermission(o))==="granted";
}
async function linkFile(){
  if(!hasFS)return exportCsv();
  try{
    const [h]=await showOpenFilePicker({types:[{description:"Fichier CSV",accept:{"text/csv":[".csv"]}}]});
    if(!await ensurePerm(h,true))return setFs("perm");
    handle=h;await kvSet("h",h);
    await loadFromFile(true);
  }catch(e){if(e.name!=="AbortError")setFs("err",e.message)}
}
let skipConnect=false;
async function createFile(){
  if(!hasFS)return;
  try{
    const h=await showSaveFilePicker({suggestedName:"Taches.csv",types:[{description:"Fichier CSV",accept:{"text/csv":[".csv"]}}]});
    handle=h;await kvSet("h",h);
    await writeNow();
    toast("Fichier créé : "+h.name);
  }catch(e){if(e.name!=="AbortError")setFs("err",e.message)}
}
async function readText(file){
  // Excel enregistre un « CSV » simple en Windows-1252 : on le décode correctement au lieu d'abîmer les accents
  const buf=await file.arrayBuffer();
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}
  catch(e){return new TextDecoder("windows-1252").decode(buf)}
}
async function loadFromFile(first,keepSel){
  const f=await handle.getFile();lastMod=f.lastModified;
  const loaded=fromCsv(await readText(f)),lp=fromCsv.projects;
  if(loaded.length||lp.length){
    if(first&&tasks.length&&!await ask({title:`Charger les ${loaded.length} tâches du fichier ?`,msg:`« Utiliser le fichier » remplace les ${tasks.length} tâches de cette page. « Garder la page » écrase le fichier avec les tâches de cette page.`,ok:"Utiliser le fichier",cancel:"Garder la page"})){
      return writeNow();
    }
    tasks=loaded;projects=lp;ensureProjects();const fixed=cleanPdvs();persistLocal();
    if(!keepSel){
      const dates=tasks.filter(t=>!t.week).map(t=>t.date);
      sel=dates.includes(todayIso)?todayIso:(dates.sort().pop()||tasks.map(t=>t.date).sort().pop()||todayIso);
    }
    render();setFs("ok","chargé");
    if(!keepSel)toast(tasks.length+" tâches chargées depuis "+handle.name);
    if(fixed){save();toast(fixed+" nom(s) de PDV harmonisé(s) (ex. lac / LAC)")}
  }else if(tasks.length)return writeNow();
  else setFs("ok");
}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem("suivi-projets",JSON.stringify(projects))}catch(e){}}
function ensureProjects(){tasks.forEach(t=>{if(t.project&&!projects.some(p=>p.name===t.project))projects.push({name:t.project})})}
function save(){
  persistLocal();
  if(!handle)return;
  dirty=true;setFs("busy");
  clearTimeout(wTimer);wTimer=setTimeout(writeNow,250);
}
function writeNow(){
  busy=busy.then(async()=>{
    try{
      if(!await ensurePerm(handle,false)){setFs("perm");return}
      const w=await handle.createWritable();
      await w.write(toCsv());await w.close();
      lastMod=(await handle.getFile()).lastModified;dirty=false;
      setFs("ok","à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){
      setFs("err",e.name==="NoModificationAllowedError"||/lock|busy|used/i.test(e.message)
        ?"Fichier verrouillé : fermez-le dans Excel puis réessayez":"Erreur : "+e.message);
    }
  });
  return busy;
}
// Surveille le fichier : si Excel (ou autre) le modifie, la page se met à jour toute seule.
let asking=false;
async function syncOnFocus(){
  if(!handle||fsState==="perm"||fsState==="busy"||asking)return;
  try{
    const f=await handle.getFile();
    if(f.lastModified!==lastMod){
      if(dirty){
        asking=true;
        const load=await ask({title:"Fichier modifié ailleurs",msg:"Le fichier a changé (Excel ?) alors que la page a des changements non enregistrés. Charger le fichier fait perdre ceux de la page ; garder la page écrase le fichier.",ok:"Charger le fichier",cancel:"Garder la page"});
        asking=false;
        if(!load)return writeNow();
      }
      await loadFromFile(false,true);
      toast("Fichier modifié ailleurs : page actualisée");
    }else if(dirty)return writeNow();
  }catch(e){}
}
setInterval(()=>{if(!document.hidden)syncOnFocus()},2000);

/* ---------- portée & filtres ---------- */
function labelEnd(l){const m=(l||"").match(/->\s*(\d{2})\/(\d{2})\/(\d{2})/);return m?`20${m[1]}-${m[2]}-${m[3]}`:null}
// une tâche "semaine seulement" couvre toute la plage de sa semaine d'origine
const range=t=>{const a=t.week&&labelStart(t.weekLabel),b=a&&labelEnd(t.weekLabel);return a&&b?[a,b]:[t.date,t.date]};
// une tâche terminée un autre jour apparaît aussi le jour où elle a été terminée
const doneOn=t=>isDone(t.status)&&t.doneDate||null;
const inScope=t=>{
  if(scope==="all")return true;
  const d=doneOn(t);
  if(scope==="day")return t.date===sel||d===sel;
  const [lo,hi]=weekRange(sel),[a,b]=range(t);
  return (a<=hi&&b>=lo)||(d&&d>=lo&&d<=hi);
};
let urgF=false;
// filtre Urgentes : toutes les urgentes encore « À faire » ou « En cours », tous jours confondus
const isUrgOpen=t=>t.date&&t.urgent&&(t.status==="todo"||t.status==="wip");
// filtres cumulables : plusieurs situations à la fois + « Urgentes » en plus (aucun choix = tout)
const isOn=k=>k==="all"?!statusF.size&&!urgF:statusF.has(k);
const matchStatus=t=>{
  if(!statusF.size)return !urgF||!isDone(t.status);   // Urgentes seul : les tâches encore ouvertes
  return [...statusF].some(k=>k==="fin"?isDone(t.status):t.status===k);
};
// champ visé par la recherche : contexte (PDV), tâche, ou tout (PDV + tâche + commentaire)
const qText=t=>qf==="pdv"?t.pdv:qf==="task"?t.task:t.pdv+" "+t.task+" "+t.comment;
const matchQ=t=>!q||norm(qText(t)).includes(norm(q));
const matchPdv=t=>!pdvF||t.pdv===pdvF;
// une recherche en cours porte sur toutes les tâches, tous jours confondus
const scoped=()=>tasks.filter(t=>t.date&&(q.trim()||urgF||inScope(t))&&(!urgF||t.urgent)&&matchPdv(t)&&matchQ(t));

/* ---------- rendu ---------- */
function renderHero(items){
  const n=items.length,d=items.filter(t=>isDone(t.status)).length,w=items.filter(t=>t.status==="wip").length,
    c=items.filter(t=>t.status==="conf").length,td=items.filter(t=>t.status==="todo").length;
  const pct=n?Math.round(d/n*100):0;
  $("pct").textContent=pct+"%";$("arc").style.strokeDashoffset=251.3*(1-pct/100);
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  let title="Toutes les tâches";
  if(scope==="day")title=cap(fmt(sel,{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
  if(scope==="week"){
    const [a,b]=weekRange(sel);
    title="Semaine du "+fmt(a,{day:"numeric"})+" au "+fmt(b,{day:"numeric",month:"long",year:"numeric"});
  }
  if(urgF)title="🔥 Urgentes : tous les jours";
  if(q.trim())title="Recherche : « "+q.trim()+" »";
  $("scopeTitle").textContent=title;
  const S=(k,v,l)=>`<button class="stat${isOn(k)?" on":""}" data-s="${k}"><b>${v}</b><span>${l}</span></button>`;
  $("stats").innerHTML=S("all",n,"Total")+S("todo",td,"À faire")+S("wip",w,"En cours")+S("conf",c,"Confirmées")+S("fin",d,"Terminées");
}
function renderStrip(){
  const [ws,we]=weekRange(sel);let h=`<button class="btn navb" data-w="-1">‹</button><div class="days">`;
  for(let s=ws;s<=we;s=addDays(s,1)){
    const list=tasks.filter(t=>t.date===s||doneOn(t)===s),d=list.filter(t=>isDone(t.status)).length;
    h+=`<div class="day${s===sel&&scope!=="all"?" sel":""}${s===todayIso?" today":""}" data-d="${s}">
      <small>${DAYS[parse(s).getDay()]}</small><strong>${parse(s).getDate()}</strong>
      <em>${list.length?d+"/"+list.length:"–"}</em><i><u style="width:${list.length?d/list.length*100:0}%"></u></i></div>`;
  }
  $("strip").innerHTML=h+`</div><button class="btn navb" data-w="1">›</button>`;
}

// période : début (jour de la tâche, ou jour d'origine si reportée) -> fin (jour + heure du clic sur Terminé)
function period(t){
  if(!isDone(t.status)||!t.doneDate)return "";
  const d=s=>fmt(s,{weekday:"short",day:"numeric",month:"short"}),at=t.doneTime?" à "+t.doneTime:"";
  const a=t.week?null:(t.from||t.date);
  if(!a||a===t.doneDate)return `Fini le ${d(t.doneDate)}${at}`;
  const n=Math.round((parse(t.doneDate)-parse(a))/864e5);
  return `Début ${d(a)}${t.time&&a===t.date?" "+t.time:""} → Fini ${d(t.doneDate)}${at}${n>0?` (${n} j)`:""}`;
}
const projTag=t=>view==="projects"?`<span class="dj">${t.date?fmt(t.date,{day:"numeric",month:"short"}):"sans jour"}</span>`:(t.project?`<span class="prj">📁 ${esc(t.project)}</span>`:"");
const pdvTag=t=>!t.pdv?"":`<span class="pdv" style="--h:${hue(t.pdv)}">${esc(t.pdv)}</span>`;
function taskHtml(t){
  const s=STATUS[t.status];
  return `<div class="task st-${t.status}${isDone(t.status)?" done":""}${isUrg(t)?" urgent":""}" data-id="${t.id}">

    <div class="t" data-act="edit">${isUrg(t)?`<span class="ub">URGENT</span>`:""}${t.date&&t.time?`<span class="tm">${t.time}</span>`:""}${projTag(t)}${pdvTag(t)}${esc(t.task)}${t.week?`<span class="wk" title="Seule la semaine est connue. Modifiez la tâche pour fixer le jour.">jour ?</span>`:""}${t.comment?`<span class="c">${esc(t.comment)}</span>`:""}${period(t)?`<span class="per">✓ ${period(t)}</span>`:""}</div>
    <div class="right">
      <select class="badge ${s.cls}" data-act="st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${k===t.status?" selected":""}>${v.label}</option>`).join("")}</select>
      ${safeUrl(t.link)?`<a class="icon mail" href="${esc(t.link)}" target="_blank" rel="noopener noreferrer" title="Ouvrir le lien">${linkIcon(t.link)}</a>`:""}
      <button class="icon fire${t.urgent?" lit":""}" data-act="urg" title="${t.urgent?"Urgent : cliquer pour éteindre":"Pas urgent : cliquer pour allumer"}">🔥</button>
      <button class="icon" data-act="edit" title="Modifier">✎</button>
      ${view==="projects"?`<button class="icon" data-act="unproj" title="Retirer du projet (la tâche est conservée)">⊖</button>`:""}
      <button class="icon" data-act="del" title="${view==="projects"?"Supprimer définitivement la tâche":"Supprimer"}">✕</button>
    </div></div>`;
}
function renderList(items){
  if(!items.length)return `<div class="empty"><b>Aucune tâche ici</b>${tasks.length?"Changez de jour ou de filtre, ou ":""}cliquez sur « + Nouvelle tâche ».</div>`;
  const wkKey=t=>t.week&&labelStart(t.weekLabel)?"W"+t.weekLabel:(scope==="day"&&!q.trim()&&!urgF&&t.date!==sel&&doneOn(t)===sel?sel:t.date);
  const g={};[...items].sort(byPrio).forEach(t=>(g[wkKey(t)]??=[]).push(t));
  const sortKey=k=>k[0]==="W"?labelStart(k.slice(1)):k;
  return Object.keys(g).sort((a,b)=>sortKey(b).localeCompare(sortKey(a))).map(dt=>{
    const l=g[dt],done=l.filter(t=>isDone(t.status)).length,open=l.filter(t=>!isDone(t.status)).length;

      const lab=dt.slice(1);

    }

    return `<section class="group"><h3 class="ghead">${fmt(dt,{weekday:"long",day:"numeric",month:"long"})}<span>${done}/${l.length} terminées</span>${carry}</h3>${l.map(taskHtml).join("")}</section>`;
  }).join("");
}

/* ---------- projets ---------- */
// un projet urgent n'est « allumé » que tant qu'il n'est pas terminé (comme une tâche)
const pUrg=p=>!!(p.urgent&&!p.done);
// « terminé » pour un projet se décide à la main : des tâches toutes faites ne ferment pas le projet
function projInfo(p){
  const l=tasks.filter(t=>t.project===p.name),done=l.filter(t=>isDone(t.status)).length;
  const a=l.map(t=>t.from||t.date).filter(Boolean).sort()[0]||"";
  const d=s=>fmt(s,{day:"numeric",month:"short"});
  let per=a?"Début "+d(a):"Aucune tâche";
  if(p.done){
    const b=p.doneDate;
    if(b&&a){const n=Math.round((parse(b)-parse(a))/864e5);per+=" → Fini "+d(b)+(n>0?` (${n} j)`:"")}
    else if(b)per="Fini le "+d(b);
  }else if(a)per+=" → en cours";
  return {l,done,per,pct:l.length?Math.round(done/l.length*100):0};
}
function renderProjects(){
  const P=projects.find(p=>p.name===openProj);
  if(!P){
    openProj=null;
    return `<div class="pnew"><input id="pName" placeholder="Nom du nouveau projet"><button class="btn primary" data-p-add>+ Projet</button></div>`+
      (projects.length?`<div class="pgrid">`+[...projects].sort((a,b)=>(+!!a.done)-(+!!b.done)||(+pUrg(b))-(+pUrg(a))).map(p=>{const i=projInfo(p);
        return `<div class="pcard${p.done?" pdone":""}${pUrg(p)?" urgent":""}" role="button" tabindex="0" data-p-open="${esc(p.name)}"><button class="icon fire pfire${p.urgent?" lit":""}" data-p-urg="${esc(p.name)}" title="${p.urgent?"Urgent : cliquer pour éteindre":"Pas urgent : cliquer pour allumer"}">🔥</button><b>${pUrg(p)?`<span class="ub">URGENT</span>`:""}${p.done?"✓ ":""}${esc(p.name)}</b><span>${p.done?"Projet terminé · ":""}${i.done}/${i.l.length} terminées · ${i.pct}%</span><i class="pbar"><u style="width:${i.pct}%"></u></i><small>${i.per}</small></div>`}).join("")+`</div>`
      :`<div class="empty"><b>Aucun projet</b>Donnez un nom à votre premier projet ci-dessus.</div>`);
  }
  const i=projInfo(P),list=[...i.l].sort((a,b)=>isDone(a.status)-isDone(b.status)||byPrio(a,b));
  return `<div class="phead"><button class="btn sm" data-p-back>← Projets</button><h2>${P.done?"✓":"📁"} ${esc(P.name)}</h2><button class="btn sm${P.done?"":" primary"}" data-p-done>${P.done?"↺ Rouvrir le projet":"✓ Marquer le projet terminé"}</button><button class="btn sm${P.urgent?" danger":""}" data-p-urg="${esc(P.name)}">🔥 ${P.urgent?"Urgent : éteindre":"Marquer urgent"}</button><button class="btn sm" data-p-rename>Renommer</button><button class="btn sm" data-p-del>Supprimer</button></div>
    <div class="pinfo">${P.done?"Projet terminé":"Projet en cours"} · ${i.done}/${i.l.length} terminées · ${i.pct}% · ${i.per}</div>
    <h3 class="ghead">Tâches du projet<span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" data-p-pick>+ Tâches existantes</button><button class="btn sm primary" data-p-new>+ Nouvelle tâche</button></span></h3>`+
    (list.length?list.map(taskHtml).join(""):`<div class="empty"><b>Aucune tâche</b>Ajoutez des tâches déjà faites ou assignées, ou créez-en une nouvelle. Videz le jour pour qu'une tâche reste dans le projet seulement.</div>`);
}
function addProject(){
  const n=$("pName").value.trim().replace(/\s+/g," ");
  if(!n){toast("Écrivez d'abord le nom du projet");$("pName").focus();return}
  if(projects.some(p=>pkey(p.name)===pkey(n)))return toast("Ce projet existe déjà");
  projects.push({name:n});openProj=n;save();render();
}
function projectAction(b){
  const has=a=>b.hasAttribute(a);
  if(has("data-p-open")){openProj=b.dataset.pOpen;render();scrollTo(0,0)}
  else if(has("data-p-back")){openProj=null;render()}
  else if(has("data-p-add"))addProject();
  else if(has("data-p-new"))openForm();
  else if(has("data-p-pick"))openPick();
  else if(has("data-p-urg")){
    const p=projects.find(x=>x.name===b.dataset.pUrg);
    if(p){p.urgent=!p.urgent;save();render()}
  }else if(has("data-p-done")){
    const p=projects.find(x=>x.name===openProj);
    p.done=!p.done;p.doneDate=p.done?todayIso:"";save();render();
  }else if(has("data-p-rename")){
    const o=openProj;
    ask({title:"Renommer le projet",input:o,ok:"Renommer"}).then(v=>{
      const n=(v||"").trim().replace(/\s+/g," ");
      if(!n||n===o)return;
      if(projects.some(p=>p.name!==o&&pkey(p.name)===pkey(n)))return toast("Ce nom existe déjà");
      projects.find(p=>p.name===o).name=n;tasks.forEach(t=>{if(t.project===o)t.project=n});
      if(openProj===o)openProj=n;save();render();
    });
  }else if(has("data-p-del")){
    const o=openProj,n=tasks.filter(t=>t.project===o).length;
    ask({title:`Supprimer « ${o} » ?`,msg:`Le projet et ses ${n} tâche(s) seront supprimés. Vous pourrez annuler juste après.`,ok:"Supprimer",danger:true}).then(yes=>{
      if(!yes)return;
      toast("Projet supprimé",true);
      tasks=tasks.filter(t=>t.project!==o);projects=projects.filter(p=>p.name!==o);openProj=null;save();render();
    });
  }
}
// tâches déjà créées (faites ou assignées) qui n'appartiennent à aucun projet
let picked=new Set();
function renderPick(){
  const k=norm($("pickQ").value);
  const l=tasks.filter(t=>!t.project&&(!k||norm(t.pdv+" "+t.task+" "+t.comment).includes(k))).sort(byRecent);
  $("pickList").innerHTML=l.length?l.map(t=>`<label class="pk"><input type="checkbox" value="${t.id}"${picked.has(t.id)?" checked":""}><span class="pkt">${t.pdv?pdvTag(t):""}${esc(t.task)}</span><small>${t.date?fmt(t.date,{day:"numeric",month:"short"}):"sans jour"} · ${STATUS[t.status].label}</small></label>`).join("")
    :`<div class="empty">${k?"Aucun résultat":"Toutes vos tâches sont déjà dans un projet"}</div>`;
}
function openPick(){picked=new Set();$("pickQ").value="";renderPick();$("pick").showModal();$("pickQ").focus()}
$("pickQ").oninput=renderPick;
$("pickList").onchange=e=>{if(e.target.type==="checkbox")e.target.checked?picked.add(e.target.value):picked.delete(e.target.value)};
$("pickCancel").onclick=()=>$("pick").close();
$("pform").onsubmit=()=>{
  if(!picked.size||!openProj)return;
  toast(picked.size+" tâche(s) ajoutée(s) au projet",true);
  tasks.forEach(t=>{if(picked.has(t.id))t.project=openProj});
  save();render();
};
function render(){
  document.body.classList.toggle("pv",view==="projects");
  const nu=projects.filter(pUrg).length;
  $("projBtn").textContent=view==="projects"?"📅 Jours":"📁 Projets"+(nu?` · 🔥${nu}`:"");
  if(view==="projects"){
    const keep=$("pName")?$("pName").value:"";
    $("main").innerHTML=renderProjects();
    if(keep&&$("pName"))$("pName").value=keep;
    return;
  }
  const base=scoped();
  renderHero(base);renderStrip();renderControls();
  const items=base.filter(matchStatus).sort(byRecent);
  $("main").innerHTML=mode==="board"?renderBoard(items):renderList(items);
}

/* ---------- actions ---------- */
let snap=null,snapP=null,toastT=null;
function toast(msg,undo){
  $("toastTxt").textContent=msg;$("toastBtn").hidden=!undo;$("toast").hidden=false;snap=undo?JSON.stringify(tasks):null;snapP=undo?JSON.stringify(projects):null;
  clearTimeout(toastT);toastT=setTimeout(()=>$("toast").hidden=true,undo?10000:5500);
}
$("toastBtn").onclick=()=>{if(snap){tasks=JSON.parse(snap);if(snapP)projects=JSON.parse(snapP);save();render()}$("toast").hidden=true};
const find=id=>tasks.find(t=>t.id===id);
// l'heure du clic sur « terminé » est mémorisée ; rouvrir la tâche l'efface
function stampStatus(t,s){
  if(isDone(s)&&!isDone(t.status)){t.doneDate=todayIso;t.doneTime=new Date().toTimeString().slice(0,5)}
  else if(!isDone(s)){t.doneDate=null;t.doneTime=""}
  t.status=s;
}
function setStatus(t,s){stampStatus(t,s);save();render()}

const dlg=$("dlg"),f=$("form");
f.status.innerHTML=Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");
let timeTouched=false;
f.time.oninput=()=>{timeTouched=true};
// une tâche de projet peut n'avoir ni jour ni PDV
const syncReq=()=>{const p=!!f.project.value;f.date.required=!p;f.pdv.required=!p};
f.project.onchange=syncReq;
function openForm(t){
  editId=t?t.id:null;
  $("dlgTitle").textContent=t?"Modifier la tâche":"Nouvelle tâche";$("ok").textContent=t?"Enregistrer":"Ajouter";
  const inP=view==="projects";
  f.project.innerHTML=`<option value="">Aucun</option>`+projects.map(p=>`<option>${esc(p.name)}</option>`).join("");
  f.project.value=t?(t.project||""):(inP&&openProj||"");syncReq();
  f.date.value=t?t.date:(inP||scope==="all"?todayIso:sel);f.pdv.value=t?t.pdv:(inP?"":pdvF);f.task.value=t?t.task:"";
  f.comment.value=t?t.comment:"";f.link.value=t?(t.link||""):"";f.status.value=t?t.status:"todo";f.urgent.checked=!!(t&&t.urgent);
  f.time.value=t?(t.time||""):new Date().toTimeString().slice(0,5);
  timeTouched=!!t;
  dlg.showModal();(t?f.task:f.pdv).focus();
}
$("new").onclick=()=>openForm();
$("cancel").onclick=()=>dlg.close();
f.onsubmit=e=>{
  if(!f.checkValidity())return;
  const v={date:f.date.value,pdv:f.pdv.value.trim(),task:f.task.value.trim(),comment:f.comment.value.trim(),link:safeUrl(f.link.value.trim()),status:f.status.value,time:f.time.value,urgent:f.urgent.checked,week:false,weekLabel:null,project:f.project.value};
  if(!v.date)v.from=(editId&&(find(editId).from||find(editId).date))||todayIso;
  // heure laissée telle quelle = l'heure de l'enregistrement, pas celle de l'ouverture du formulaire
  if(!editId&&!timeTouched)v.time=new Date().toTimeString().slice(0,5);
  v.pdv=v.pdv.replace(/\s+/g," ");v.pdv=canonMap()[pkey(v.pdv)]||v.pdv;
  if(editId){
    const t=find(editId);
    if(v.date&&t.date!==v.date)v.from=null;
    const st=v.status;delete v.status;Object.assign(t,v);stampStatus(t,st);
  }else{const t={id:uid(),...v,status:"todo"};stampStatus(t,v.status);tasks.push(t)}
  if(v.date)sel=v.date;save();render();
};
$("strip").onclick=e=>{
  urgF=false;
  const w=e.target.closest("[data-w]");
  if(w){const [lo,hi]=weekRange(sel);sel=addDays(w.dataset.w<0?lo:hi,Number(w.dataset.w));if(scope==="all")scope="day";render();return}
  if(e.target.closest("[data-today]")){sel=todayIso;if(scope==="all")scope="day";render();return}
  const d=e.target.closest("[data-d]");if(d){sel=d.dataset.d;if(scope==="all")scope="day";savePrefs();render()}
};
$("todayBtn").onclick=()=>{urgF=false;sel=todayIso;if(scope==="all")scope="day";render()};
$("scope").onclick=e=>{const b=e.target.closest("button");if(b){urgF=false;scope=b.dataset.v;savePrefs();render()}};
$("mode").onclick=e=>{const b=e.target.closest("button");if(b){mode=b.dataset.v;savePrefs();render()}};
const pickStatus=e=>{
  if(e.target.closest("[data-u]")){urgF=!urgF;render();return}
  const s=e.target.closest("[data-s]");if(!s)return;
  const k=s.dataset.s;
  if(k==="all"){statusF.clear();urgF=false}
  else if(statusF.has(k))statusF.delete(k);else statusF.add(k);
  render();
};
$("chips").onclick=pickStatus;$("stats").onclick=pickStatus;
$("q").oninput=e=>{q=e.target.value;render()};
$("qf").onclick=e=>{const b=e.target.closest("button");if(b){qf=b.dataset.v;savePrefs();render()}};
$("pdvSel").onchange=e=>{pdvF=e.target.value;render()};
$("main").onchange=e=>{
  if(e.target.dataset.act!=="st")return;
  setStatus(find(e.target.closest(".task").dataset.id),e.target.value);
};
$("main").onclick=e=>{
  const pb=e.target.closest("[data-p-open],[data-p-back],[data-p-add],[data-p-new],[data-p-pick],[data-p-done],[data-p-urg],[data-p-rename],[data-p-del]");
  if(pb)return projectAction(pb);
  const c=e.target.closest("[data-carry]");
  if(c){
    toast("Tâches reportées à aujourd'hui",true);
    tasks.forEach(t=>{if(t.date===c.dataset.carry&&!isDone(t.status)){if(!t.week)t.from??=t.date;t.date=todayIso;t.week=false;t.weekLabel=null}});
    save();render();return;
  }
  const a=e.target.closest("[data-act]");if(!a||a.tagName==="SELECT")return;
  const t=find(a.closest(".task").dataset.id);
  if(a.dataset.act==="edit")openForm(t);
  if(a.dataset.act==="urg"){t.urgent=!t.urgent;save();render()}
  if(a.dataset.act==="tick")setStatus(t,isDone(t.status)?"todo":"ok");
  if(a.dataset.act==="unproj"){
    toast("Tâche retirée du projet (elle est conservée)",true);
    t.project="";if(!t.date)t.date=t.from||todayIso;   // sans jour ni projet, elle disparaîtrait partout
    save();render();
  }
  if(a.dataset.act==="del"){
    const kill=()=>{toast("Tâche supprimée",true);tasks=tasks.filter(x=>x!==t);save();render()};
    if(view==="projects")ask({title:"Supprimer cette tâche ?",msg:`« ${t.task} » sera supprimée définitivement. Pour la garder, utilisez « Retirer du projet » (⊖).`,ok:"Supprimer",danger:true}).then(y=>{if(y)kill()});
    else kill();
  }
};
// tableau : glisser-déposer pour changer la situation, double-clic pour modifier
let dragId=null;
$("main").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed="move"}});
$("main").addEventListener("dragover",e=>{const c=e.target.closest(".col");if(c&&dragId){e.preventDefault();document.querySelectorAll(".col").forEach(x=>x.classList.toggle("over",x===c))}});
$("main").addEventListener("drop",e=>{
  const c=e.target.closest(".col");if(!c||!dragId)return;e.preventDefault();
  const t=find(dragId);dragId=null;const k=c.dataset.col;
  setStatus(t,k==="fin"?(isDone(t.status)?t.status:"ok"):k);
});
$("main").addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col").forEach(x=>x.classList.remove("over"))});
$("main").addEventListener("dblclick",e=>{const c=e.target.closest(".card");if(c)openForm(find(c.dataset.id))});

$("projBtn").onclick=()=>{view=view==="projects"?"days":"projects";render();if($("pName"))$("pName").focus()};
$("main").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="pName"){e.preventDefault();addProject()}
  if(e.key==="Enter"&&e.target.classList.contains("pcard")){e.preventDefault();e.target.click()}
});
$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";savePrefs();
};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")||dlg.open||e.ctrlKey||e.metaKey)return;
  if(e.key==="n"||e.key==="N"){e.preventDefault();openForm()}
  if(e.key==="/"){e.preventDefault();$("q").focus()}
});

/* ---------- démarrage ---------- */
$("today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
ensureProjects();if(cleanPdvs())persistLocal();
render();
(async()=>{
  if(!hasFS)return setFs("nofs");
  handle=await kvGet("h");
  if(!handle)return setFs("none");
  try{
    if(await ensurePerm(handle,false))await loadFromFile(false);else setFs("perm");
  }catch(e){handle=null;setFs("none")}
})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
setFs(hasFS?"none":"nofs");
</script>
</body>
</html>
